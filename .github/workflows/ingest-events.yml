name: NGP Today — scheduled ingestion and deploy
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ngp-today-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      NAGPUR_ICS_FEEDS: ${{ vars.NAGPUR_ICS_FEEDS }}
      NAGPUR_ICS_AUTO_PUBLISH: ${{ vars.NAGPUR_ICS_AUTO_PUBLISH }}
      NGP_RSS_FEEDS: ${{ vars.NGP_RSS_FEEDS }}
      NGP_RSS_FEED_NAMES: ${{ vars.NGP_RSS_FEED_NAMES }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]'
      - name: Run ingestion tests
        run: python -m pytest -q
      - name: Initialize database
        run: python -c 'from nagpur_today.storage import connect; connect("data/events.db").close()'
      - name: Ingest approved calendar feeds
        shell: bash
        run: |
          if [[ "$NAGPUR_ICS_FEEDS" != *"https://"* ]]; then
            echo 'No valid HTTPS calendar feed configured; skipping.'
          elif [[ "${NAGPUR_ICS_AUTO_PUBLISH,,}" == 'true' ]]; then
            python -m nagpur_today.cli ingest-ical --db data/events.db --publish-approved-feeds
          else
            python -m nagpur_today.cli ingest-ical --db data/events.db
          fi
      - name: Discover RSS candidates for review
        shell: bash
        run: |
          if [[ "$NGP_RSS_FEEDS" == *"https://"* ]]; then
            python -m nagpur_today.cli discover-rss --output data/event_candidates.json
          else
            mkdir -p data
            printf '{"candidates": []}\n' > data/event_candidates.json
            echo 'No valid HTTPS RSS feed configured; created an empty review queue.'
          fi
      - name: Export approved events to website
        run: |
          python -m nagpur_today.cli export-jekyll-json --db data/events.db --output data/published_events.json
          python -c 'import json; from pathlib import Path; e=json.loads(Path("data/published_events.json").read_text()); p=Path("website/_data/events.json"); p.parent.mkdir(parents=True,exist_ok=True); old=p.read_text() if p.exists() else "[]"; p.write_text(json.dumps(e,indent=2,ensure_ascii=False)+chr(10) if e else old,encoding="utf-8"); print(f"Prepared {len(e)} published events; retained existing website data if export was empty")'
      - name: Commit updated event data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.db website/_data/events.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh event data'
            git push origin HEAD:main
          fi
      - name: Archive RSS review candidates
        uses: actions/upload-artifact@v4
        with:
          name: ngp-today-event-candidates
          path: data/event_candidates.json
          if-no-files-found: warn
          retention-days: 14
  deploy:
    needs: ingest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest repository content
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./website
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
