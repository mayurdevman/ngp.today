[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nagpur-today-ingest"
version = "0.1.0"
description = "Starter ingestion pipeline for a Nagpur events directory"
requires-python = ">=3.11"
dependencies = ["python-dateutil>=2.9,<3"]

[project.scripts]
nagpur-today = "nagpur_today.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
