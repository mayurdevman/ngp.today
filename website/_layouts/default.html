<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#080808">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"NGP Today","description":"{{ site.description | escape }}","inLanguage":"en-IN"}</script>
</head>
<body>
  <header class="topbar"><div class="wrap nav"><a class="brand" href="{{ '/' | relative_url }}">NGP Today</a><span class="domain">ngp.today</span></div></header>
  {{ content }}
  <footer class="wrap footer"><span>NGP Today</span><span>Nagpur, Maharashtra</span></footer>
  <script src="{{ '/assets/js/events.js' | relative_url }}" defer></script>
</body></html>
